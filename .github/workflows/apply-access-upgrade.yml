name: Apply access upgrade

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  upgrade-and-test:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Apply access-control integration
        run: python scripts/apply_access_upgrade.py

      - name: Compile
        run: python -m py_compile bot.py services/*.py

      - name: Tests
        run: python -m pytest -q

      - name: Commit integrated upgrade
        run: |
          if git diff --quiet; then
            echo 'No integration changes required.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add bot.py services/access_control.py tests/test_access_control.py scripts/apply_access_upgrade.py .github/workflows/apply-access-upgrade.yml
          git commit -m 'feat: integrate atomic service access control'
          git push origin main
